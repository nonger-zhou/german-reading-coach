# CI：每次推送 / PR 跑单元测试与构建，结果显示在 GitHub 上。
# 部署由 Vercel 的 Git 集成完成（合并到 main 即部署 Production），这里不再部署；
# Vercel 构建使用 package.json 的 "vercel-build"（先跑 vitest，失败则不部署）。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
